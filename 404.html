<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DataFlow.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center">
            <div class="gradient-bg bg-clip-text text-transparent text-9xl font-bold mb-4">
                404
            </div>
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Page Not Found</h1>
            <p class="text-xl text-gray-600 mb-8">
                Oops! The page you're looking for doesn't exist.
            </p>
            <a href="/" class="inline-block gradient-bg text-white px-8 py-4 rounded-full font-bold hover:opacity-90 transition">
                <i class="fas fa-home mr-2"></i>Back to Home
            </a>
        </div>
    </div>
</body>
</html>
